{# Tarjeta de una actividad de la Agenda. La usan agenda.html y las respuestas AJAX del servidor. #}
{% set kind = (activity.type or '')|replace('type_', '') %}
{% set done = activity.status == 'completado' %}

<div class="activity-item bg-[#F5F3F0] dark:bg-gray-800 p-4 rounded-lg flex justify-between items-center gap-3 border border-gray-200 dark:border-gray-700"
     data-id="{{ activity.id }}"
     data-status="{{ activity.status }}">

    <div class="flex flex-col min-w-0">

        <span class="break-words {{ 'line-through text-gray-400 dark:text-gray-500' if done else 'text-gray-800 dark:text-gray-200' }}">
            {{ activity.title }}
        </span>

        <span class="text-xs text-gray-500">
            {{ _('type_' ~ kind) }}
        </span>

    </div>

    <div class="flex items-center gap-2 shrink-0">

        <button type="button"
                data-action="toggle"
                data-next-status="{{ 'pendiente' if done else 'completado' }}"
                title="{{ _('mark_pending') if done else _('mark_done') }}"
                class="px-2 py-1 rounded transition disabled:opacity-50 {{ 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300' if done else 'text-green-600 hover:text-green-800' }}">
            {{ '↩' if done else '✓' }}
        </button>

        <button type="button"
                data-action="delete"
                title="{{ _('delete') }}"
                class="text-red-400 hover:text-red-600 px-2 py-1 transition disabled:opacity-50">
            🗑️
        </button>

    </div>

</div>
